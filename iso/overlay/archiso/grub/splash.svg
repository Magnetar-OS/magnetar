<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- GRUB draws the menu over the middle of this, so the middle stays dark
       and the identity sits at the top where nothing overlaps it. Generated
       by distribution/build.py. -->
  <defs>
    <radialGradient id="sky" cx="50%" cy="18%" r="85%">
      <stop offset="0%"   stop-color="#121820"/>
      <stop offset="45%"  stop-color="#0B0F14"/>
      <stop offset="100%" stop-color="#06080B"/>
    </radialGradient>
    <radialGradient id="starglow">
      <stop offset="0%"   stop-color="#9BE8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#9BE8FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- The mark is logo/magnetar.svg, inlined (ids prefixed "m"), with a soft
       glow behind the star. -->
  <circle cx="300.0" cy="157.2" r="60" fill="url(#starglow)"/>
  <svg x="223" y="73" width="154" height="154" viewBox="0 0 256 256"><defs><linearGradient id="mfield" x1="36" y1="48" x2="220" y2="208" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7B5CFF"/><stop offset="1" stop-color="#2AA9E0"/></linearGradient><radialGradient id="mbg" cx="50%" cy="40%" r="78%"><stop offset="0" stop-color="#0E1730"/><stop offset="1" stop-color="#04060C"/></radialGradient><radialGradient id="mglow"><stop offset="0" stop-color="#9BE8FF" stop-opacity=".45"/><stop offset="1" stop-color="#9BE8FF" stop-opacity="0"/></radialGradient><radialGradient id="mcore" cx="40%" cy="38%" r="70%"><stop offset="0" stop-color="#9BE8FF"/><stop offset="1" stop-color="#1E8FD0"/></radialGradient></defs><g transform="translate(0 0.0)"><path d="M38 198 V88 A30 30 0 0 1 98 88 V140 A30 30 0 0 0 158 140 V88 A30 30 0 0 1 218 88 V198" fill="none" stroke="url(#mfield)" stroke-width="26" stroke-linecap="butt" stroke-linejoin="round"/><circle cx="128" cy="140" r="14" fill="url(#mcore)"/></g></svg>

  <text x="400" y="140" font-family="Inter, DejaVu Sans, sans-serif" font-size="76"
        font-weight="600" fill="#EAF6FF" letter-spacing="2">Magnetar</text>
  <text x="404" y="186" font-family="Inter, DejaVu Sans, sans-serif" font-size="24"
        fill="#7E93A6" letter-spacing="4">COSMIC ON CACHYOS</text>
</svg>
