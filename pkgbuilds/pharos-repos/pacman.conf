#
# /etc/pacman.conf — Pharos
#
# The order of the repository sections below is policy, not preference. pacman
# resolves each package by walking these sections top to bottom and stopping at
# the first database that carries the name; only that repository's version is
# considered. Position is therefore a hard priority, and it is the only lock
# pacman offers that acts on every package automatically.
#
# Read docs/REPOS.md before reordering anything. Moving a section up here is
# how a distribution silently re-sources its own base system.
#

[options]
HoldDir     = /var/lib/pacman/
CacheDir    = /var/cache/pacman/pkg/
LogFile     = /var/log/pacman.log
GPGDir      = /etc/pacman.d/gnupg/
HookDir     = /etc/pacman.d/hooks/
RootDir     = /
DBPath      = /var/lib/pacman/

Architecture = auto
ParallelDownloads = 5
DownloadUser = alpm
CheckSpace
VerbosePkgLists
ILoveCandy

# Not a version pin — pacman has none. This forces a confirmation before
# removing anything that leaves the machine unbootable or unable to install
# packages. pharos-repos is on the list because dropping it silently removes
# the repository configuration everything else depends on.
HoldPkg = pacman glibc systemd base linux-cachyos pharos-repos

# Empty, and it should stay that way. An IgnorePkg on a rolling release is a
# partial upgrade with a delay fuse. If one is genuinely needed it goes in
# /etc/pacman.d/pharos-repos.d/99-local.conf with a comment saying who, why,
# and what retires it.
#IgnorePkg =

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# --- 1. CPU-optimised rebuilds of core/extra -------------------------------
# Must outrank the repositories they rebuild, or CachyOS's reason for existing
# is bypassed. Enable the v4 set or the v3 set, never both, and never together
# with ALHP — see "Forbidden combinations" in docs/REPOS.md.

[cachyos-znver4]
Include = /etc/pacman.d/cachyos-v4-mirrorlist

[cachyos-core-znver4]
Include = /etc/pacman.d/cachyos-v4-mirrorlist

[cachyos-extra-znver4]
Include = /etc/pacman.d/cachyos-v4-mirrorlist

# --- 2. Pharos -------------------------------------------------------------
# Above [cachyos] so a Pharos package can deliberately replace a CachyOS one.
# Below the optimised rebuilds so it can never shadow one. Every package here
# is named pharos-*, so incidental shadowing is structurally impossible;
# tools/repo-audit.sh proves that on every build rather than assuming it.

[pharos]
SigLevel = Required DatabaseOptional
Server = https://entro314-labs.github.io/pharos-repo/$arch

# --- 3. CachyOS ------------------------------------------------------------

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# --- 4. entro314labs applications ------------------------------------------
# Released desktop applications, not system components. Below [cachyos] so it
# can never win a name collision against a system package.

[entro314labs]
SigLevel = Required DatabaseOptional
Server = https://entro314-labs.github.io/arch-repo/$arch

# --- 5. Arch ---------------------------------------------------------------
# No *-testing. The CachyOS repos already track ahead of Arch stable; layering
# Arch testing on that produces a system nobody can support, us included.

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# --- 6-8. Third parties, locked and ordered --------------------------------
# The glob expands in filename order, and every file in that directory sorts
# below the Arch sections declared above. A drop-in cannot outrank [core] or
# [extra] because there is nowhere in there for it to go. The number in each
# filename is its priority.

Include = /etc/pacman.d/pharos-repos.d/*.conf
