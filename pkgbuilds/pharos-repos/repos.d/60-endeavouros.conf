# EndeavourOS — the eos-* tools. ~40 packages, nearly all uniquely named.
#
# Below [extra] on purpose: this repo is allowed to supply names Arch does not
# have, never to replace one Arch does. See docs/REPOS.md.
#
# Trust path: endeavouros-keyring is a dependency of pharos-repos, so the key
# is present before this repo is ever reachable.
[endeavouros]
SigLevel = Required DatabaseOptional
Include = /etc/pacman.d/endeavouros-mirrorlist
