<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- A magnetar: a neutron star whose magnetic field lines dominate it.
       The star is small and the field is enormous — that is the whole point of
       the object, so the glyph gives the field the space and the star the
       centre. -->
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#9BE8FF"/>
      <stop offset="100%" stop-color="#2AA9E0"/>
    </radialGradient>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7B5CFF"/>
      <stop offset="55%"  stop-color="#2AA9E0"/>
      <stop offset="100%" stop-color="#7B5CFF"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#field)" stroke-linecap="round">
    <!-- Dipole field loops, tilted off the rotation axis the way a real
         magnetar's are. -->
    <g transform="rotate(-24 128 128)">
      <ellipse cx="128" cy="128" rx="34"  ry="104" stroke-width="7" opacity="0.95"/>
      <ellipse cx="128" cy="128" rx="66"  ry="104" stroke-width="5" opacity="0.62"/>
      <ellipse cx="128" cy="128" rx="96"  ry="100" stroke-width="3.5" opacity="0.34"/>
    </g>
  </g>

  <circle cx="128" cy="128" r="30" fill="url(#core)"/>
  <circle cx="128" cy="128" r="30" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.85"/>
</svg>
