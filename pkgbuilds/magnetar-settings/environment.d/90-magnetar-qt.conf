# Qt applications under COSMIC.
#
# Qt picks a platform theme by lowercasing XDG_CURRENT_DESKTOP and looking for
# a matching plugin, so under COSMIC it would find cutecosmic's "cosmic" key on
# its own. This states it anyway, for one reason: if anything else on the system
# sets QT_QPA_PLATFORMTHEME — qt5ct and qt6ct both do, and both are things
# people install — the auto-detection never runs and Qt applications silently
# stop following COSMIC's colours and dark mode.
#
# Setting it here makes the choice explicit and survives that. If cutecosmic is
# ever absent, Qt falls back to its default rather than failing.
QT_QPA_PLATFORMTHEME=cosmic
