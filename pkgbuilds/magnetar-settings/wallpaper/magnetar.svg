<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160">
  <!-- Magnetar: a neutron star whose magnetic field dwarfs the star itself.
       The star is a few pixels of white; the field is the composition. Kept
       dark and low-contrast on purpose — a desktop background competes with
       window content, and a busy one loses. -->
  <defs>
    <radialGradient id="sky" cx="62%" cy="44%" r="72%">
      <stop offset="0%"   stop-color="#141A21"/>
      <stop offset="55%"  stop-color="#0D1116"/>
      <stop offset="100%" stop-color="#07090C"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="30%"  stop-color="#D8F4FF"/>
      <stop offset="65%"  stop-color="#5FC7F0"/>
      <stop offset="100%" stop-color="#2AA9E0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="field" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7B5CFF"/>
      <stop offset="50%"  stop-color="#2AA9E0"/>
      <stop offset="100%" stop-color="#7B5CFF"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="url(#sky)"/>

  <!-- Field lines, tilted off the rotation axis as a real magnetar's are.
       Blurred and low-opacity so they read as depth rather than as a diagram. -->
  <g transform="translate(2380 950)">
    <g fill="none" stroke="url(#field)" stroke-linecap="round" filter="url(#soft)"
       transform="rotate(-28)">
      <ellipse rx="150"  ry="640" stroke-width="9"  opacity="0.50"/>
      <ellipse rx="330"  ry="700" stroke-width="7"  opacity="0.32"/>
      <ellipse rx="540"  ry="740" stroke-width="5"  opacity="0.20"/>
      <ellipse rx="790"  ry="770" stroke-width="4"  opacity="0.12"/>
      <ellipse rx="1080" ry="800" stroke-width="3"  opacity="0.07"/>
    </g>
    <circle r="230" fill="url(#core)" opacity="0.55" filter="url(#glow)"/>
    <circle r="46"  fill="#FFFFFF"/>
    <circle r="46"  fill="none" stroke="#CFF0FF" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
