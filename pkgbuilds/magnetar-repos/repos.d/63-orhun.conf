# orhun
#
# Personal repository of an Arch Linux developer. Signed with their
# @archlinux.org key, which is about as good as a third-party signal gets.
#
# Measured against core+extra+multilib: 284 packages, 13 of which share a
# name with something Arch ships. Position in this directory is what keeps
# those 13 from winning — every file here sorts below the Arch repositories
# declared in /etc/pacman.conf, so a collision resolves to Arch.
#
# Signing key, read off a signature this repository actually served:
#   165E0FF7C48C226E1EC363A7F83424824B3E4B90
#   Orhun Parmaksiz <orhun@archlinux.org>
#
# SigLevel is Required, like everything else Magnetar configures. This
# repository IS signed; it is only unusable until its key is imported and
# locally signed, which is what `magnetar-repo enable orhun` does. A
# SigLevel of Never would "work" immediately and would mean running install
# scripts as root from whatever answers the DNS.
#
# Disabled until enabled deliberately:
#
#   magnetar-repo enable orhun
#
# >>> magnetar-repo:orhun
#[orhun]
#SigLevel = Required DatabaseOptional
#Server = https://pkgbuild.com/~orhun/repo
# <<< magnetar-repo:orhun
