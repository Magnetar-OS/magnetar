# garuda
#
# Garuda's tooling, served from Chaotic-AUR's mirrors. Its key comes from
# garuda-keyring, which is not in any repository configured here — see the
# note on bootstrapping below.
#
# Measured against core+extra+multilib: 102 packages, 2 of which share a
# name with something Arch ships. Position in this directory is what keeps
# those 2 from winning — every file here sorts below the Arch repositories
# declared in /etc/pacman.conf, so a collision resolves to Arch.
#
# Signing key: shipped in this project's own keyring package.
#   the Garuda project (via garuda-keyring)
#
# SigLevel is Required, like everything else Magnetar configures. This
# repository IS signed; it is only unusable until its key is imported and
# locally signed, which is what `magnetar-repo enable garuda` does. A
# SigLevel of Never would "work" immediately and would mean running install
# scripts as root from whatever answers the DNS.
#
# Disabled until enabled deliberately:
#
#   magnetar-repo enable garuda
#
# >>> magnetar-repo:garuda
#[garuda]
#SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/chaotic-mirrorlist
# <<< magnetar-repo:garuda
