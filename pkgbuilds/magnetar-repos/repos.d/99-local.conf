# Yours. Packaged as a backup file, so upgrades never overwrite what you put
# here and never delete it.
#
# This is the only place in magnetar-repos.d that is not policy. Anything added
# here still sorts below the Arch repositories declared inline in
# /etc/pacman.conf, so a drop-in cannot outrank [core] or [extra] no matter
# what number it carries.
#
# If you add an IgnorePkg, say who, why, and what retires it:
#
#   # dominikos 2026-09-07: holding foo at 1.2 until upstream fixes #123.
#   # Remove when foo >= 1.3 lands.
#   IgnorePkg = foo
