# EndeavourOS — the eos-* tools. ~40 packages, nearly all uniquely named.
#
# Below [extra] on purpose: this repo is allowed to supply names Arch does not
# have, never to replace one Arch does. See docs/REPOS.md.
#
# Trust path: endeavouros-keyring is a dependency of magnetar-repos, so the key
# is present before this repo is ever reachable.
# Disabled until enabled deliberately:
#
#   magnetar-repo enable endeavouros
#
# which imports and locally signs EndeavourOS's key, installs their keyring and
# mirrorlist, then uncomments the three lines below. The keyring cannot simply
# be a dependency of this package: it lives inside the repository it is needed
# to verify, so a fresh install has no way to fetch it.
#
# >>> magnetar-repo:endeavouros
#[endeavouros]
#SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/endeavouros-mirrorlist
# <<< magnetar-repo:endeavouros
