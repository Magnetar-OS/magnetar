# andontie-aur
#
# General prebuilt AUR. 23 names overlap Arch.
#
# Measured against core+extra+multilib: 598 packages, 23 of which share a
# name with something Arch ships. Position in this directory is what keeps
# those 23 from winning — every file here sorts below the Arch repositories
# declared in /etc/pacman.conf, so a collision resolves to Arch.
#
# Signing key, read off a signature this repository actually served:
#   493486B87A270B1F19EE5D4672BF227DD76AE5BF
#   Holly M. <kalinda@andontie.net>
#
# SigLevel is Required, like everything else Magnetar configures. This
# repository IS signed; it is only unusable until its key is imported and
# locally signed, which is what `magnetar-repo enable andontie-aur` does. A
# SigLevel of Never would "work" immediately and would mean running install
# scripts as root from whatever answers the DNS.
#
# Disabled until enabled deliberately:
#
#   magnetar-repo enable andontie-aur
#
# >>> magnetar-repo:andontie-aur
#[andontie-aur]
#SigLevel = Required DatabaseOptional
#Server = https://aur.andontie.net/$arch
# <<< magnetar-repo:andontie-aur
