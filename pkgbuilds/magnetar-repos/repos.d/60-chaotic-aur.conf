# chaotic-aur
#
# Prebuilt AUR. Highest of the third parties because it is the only one that
# shadows nothing at all: it builds AUR packages, and an AUR package is by
# definition not in the official repositories.
#
# Measured against core+extra+multilib: 3167 packages, 0 of which share a
# name with something Arch ships. Position in this directory is what keeps
# those 0 from winning — every file here sorts below the Arch repositories
# declared in /etc/pacman.conf, so a collision resolves to Arch.
#
# Signing key, read off a signature this repository actually served:
#   EF925EA60F33D0CB85C44AD13056513887B78AEB
#   the Chaotic-AUR project
#
# SigLevel is Required, like everything else Magnetar configures. This
# repository IS signed; it is only unusable until its key is imported and
# locally signed, which is what `magnetar-repo enable chaotic-aur` does. A
# SigLevel of Never would "work" immediately and would mean running install
# scripts as root from whatever answers the DNS.
#
# Disabled until enabled deliberately:
#
#   magnetar-repo enable chaotic-aur
#
# >>> magnetar-repo:chaotic-aur
#[chaotic-aur]
#SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/chaotic-mirrorlist
# <<< magnetar-repo:chaotic-aur
