# Reborn-OS
#
# RebornOS tooling. Last of the live repositories: 30 of its 338 packages
# share a name with something in core, extra or multilib, more than any
# other repo here.
#
# Measured against core+extra+multilib: 338 packages, 30 of which share a
# name with something Arch ships. Position in this directory is what keeps
# those 30 from winning — every file here sorts below the Arch repositories
# declared in /etc/pacman.conf, so a collision resolves to Arch.
#
# Signing key: shipped in this project's own keyring package.
#   the RebornOS project (via rebornos-keyring)
#
# SigLevel is Required, like everything else Magnetar configures. This
# repository IS signed; it is only unusable until its key is imported and
# locally signed, which is what `magnetar-repo enable Reborn-OS` does. A
# SigLevel of Never would "work" immediately and would mean running install
# scripts as root from whatever answers the DNS.
#
# Disabled until enabled deliberately:
#
#   magnetar-repo enable Reborn-OS
#
# >>> magnetar-repo:Reborn-OS
#[Reborn-OS]
#SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/reborn-mirrorlist
# <<< magnetar-repo:Reborn-OS
