# Chaotic-AUR — prebuilt AUR packages.
#
# LAST among live repositories, and it must stay there. This repo carries
# thousands of names that also exist in [extra]. One position higher and it
# becomes the source of truth for all of them, silently, from a third-party
# build farm.
#
# What it is for: the long tail that would otherwise cost a 40-minute compile.
# What it is not for: anything in the base system.
#
# Trust path: chaotic-keyring is a dependency of magnetar-repos.
# Disabled until enabled deliberately:
#
#   magnetar-repo enable chaotic-aur
#
# Think before you do. This repository carries thousands of package names that
# also exist in [extra]; it is placed last so it can never win one, but it is
# still several thousand packages built by someone else arriving on your
# upgrade path. Enable it when you want the long tail without the compile, not
# as a matter of course.
#
# >>> magnetar-repo:chaotic-aur
#[chaotic-aur]
#SigLevel = Required DatabaseOptional
#Include = /etc/pacman.d/chaotic-mirrorlist
# <<< magnetar-repo:chaotic-aur
