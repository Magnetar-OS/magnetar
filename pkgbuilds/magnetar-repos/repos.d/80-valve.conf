# Valve / SteamOS — jupiter and holo.
#
# LOCKED AND OFF BY DEFAULT. Both sections are commented out. Read this before
# uncommenting them.
#
# These repositories target SteamOS, which is a *frozen* Arch snapshot. Magnetar
# is rolling. Names like mesa, gamescope and the kernel exist in holo at
# versions pinned to a distribution this is not. Order alone keeps them from
# winning (they sort below chaotic-aur), but order is not the whole guard here:
#
#   Usage = Sync Search
#
# lets the database sync and `pacman -Ss` find things, while withholding
# Install and Upgrade. The repo is a catalogue you can read, not a source
# packages arrive from. Taking something from it is then deliberate: add
# Install, take the package, remove Install again — and accept it will never
# be upgraded while the lock holds. Do not grant Upgrade to fix that; a repo
# pinned to a frozen snapshot upgrading a rolling system is exactly the failure
# this lock prevents.
#
# Before enabling, be honest about what it buys. CachyOS already ships
# proton-cachyos, wine-cachyos, gamescope-session, the gaming meta package and
# a kernel tuned harder than Valve's. What is left is hardware enablement for
# Steam Deck hardware. If you are not running a Deck, this is risk for nothing.
#
# SigLevel: verify Valve's signing status for these mirrors before you enable
# them. Required is the correct default for a locked catalogue — if their
# database and packages are not signed with a key you have chosen to trust,
# the repo stays unusable, which is the right outcome for something switched
# on by accident. Do not "fix" a signature error here with TrustAll.

# >>> magnetar-repo:valve
#[jupiter]
#Usage = Sync Search
#SigLevel = Required DatabaseOptional
#Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
#
#[holo]
#Usage = Sync Search
#SigLevel = Required DatabaseOptional
#Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
# <<< magnetar-repo:valve
