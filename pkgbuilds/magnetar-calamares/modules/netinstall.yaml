# Magnetar package selection.
#
# Replaces CachyOS's netinstall.yaml, which offers a choice of desktop
# environments. Magnetar is a COSMIC distribution — offering to install Plasma
# instead would make it a CachyOS respin with different wallpaper.
#
# The hidden/critical groups are the system. The visible ones are genuinely
# optional and default to what a desktop user wants on first boot.

- name: "Magnetar base (hidden)"
  description: "Repository configuration, keyrings and hardware detection"
  hidden: true
  selected: true
  critical: true
  packages:
     - magnetar-keyring
     - magnetar-branding
     - magnetar-repos
     - magnetar-settings
     - magnetar-desktop
     - cachyos-hooks
     - cachyos-keyring
     - cachyos-mirrorlist
     - cachyos-v3-mirrorlist
     - cachyos-v4-mirrorlist
     - cachyos-rate-mirrors
     - cachyos-settings
     - chwd

- name: "Kernel (hidden)"
  description: "CachyOS kernels"
  hidden: true
  selected: true
  critical: true
  packages:
     - linux-cachyos
     - linux-cachyos-headers
     - linux-firmware

- name: "COSMIC (hidden)"
  description: "The desktop"
  hidden: true
  selected: true
  critical: true
  packages:
     - cosmic-session
     - cosmic-greeter
     - cosmic-settings
     - cosmic-files
     - cosmic-store
     - cosmic-terminal
     - cosmic-text-editor
     - cosmic-notifications
     - cosmic-osd
     - cosmic-idle
     - cosmic-randr
     - cosmic-screenshot
     - cosmic-workspaces
     - cosmic-app-library
     - cosmic-applets
     - cosmic-bg
     - cosmic-icon-theme
     - cosmic-sound-theme
     - cosmic-wallpapers
     - xdg-desktop-portal-cosmic
     - xdg-desktop-portal
     - xdg-desktop-portal-gtk
     - greetd
     - ghostty

# What CachyOS's "Base-devel + Common packages" group brings that a desktop
# needs and nothing above depends on. Magnetar's list replaces CachyOS's
# entirely, so without this an install had no Bluetooth stack, no firewall,
# only the fonts COSMIC pulls in, and no sound on the many laptops whose codec
# needs loadable firmware. CachyOS's installer steps already expect them: it
# enables bluetooth.service, and turns ufw on (deny incoming, allow outgoing)
# when ufw is installed.
#
# Package names are CachyOS's own, group for group. Not critical: a font that
# leaves the repositories must not abort an install.
- name: "Magnetar system (hidden)"
  description: "Bluetooth, the firewall, fonts and audio firmware"
  hidden: true
  selected: true
  critical: false
  packages:
     # bluetooth
     - bluez
     - bluez-hid2hci
     - bluez-libs
     - bluez-utils
     - bluez-obex
     # firewall
     - ufw
     - ufw-extras
     # fonts
     - awesome-terminal-fonts
     - noto-fonts-emoji
     - cantarell-fonts
     - noto-fonts
     - ttf-bitstream-vera
     - ttf-dejavu
     - ttf-liberation
     - ttf-opensans
     - ttf-meslo-nerd
     - noto-fonts-cjk
     # audio firmware
     - alsa-firmware
     - sof-firmware

- name: "Magnetar applications"
  description: "The COSMIC applications built for Magnetar. jump replaces the stock launcher; the rest are yours to keep or remove."
  hidden: false
  selected: true
  critical: false
  packages:
     - jump
     - magnetar-peek
     - grabit
     - locket
     - envelope
     - circle
     - slate
     - magnetar-pencil
     - pocket

- name: "Gaming"
  description: "Steam, Proton and the CachyOS gaming stack"
  hidden: false
  selected: false
  critical: false
  packages:
     - cachyos-gaming-meta
     - cachyos-gaming-applications

- name: "Office and media"
  description: "LibreOffice, an image editor and media playback"
  hidden: false
  selected: false
  critical: false
  packages:
     - libreoffice-fresh
     - gimp
     - mpv

- name: "Printing"
  description: "CUPS and driverless printing"
  hidden: false
  selected: false
  critical: false
  packages:
     - cups
     - cups-pdf
     - system-config-printer
     - avahi
     - nss-mdns
