---
# cosmic-greeter first. Calamares takes the first entry it finds installed, and
# on a Magnetar system that must be COSMIC's greeter — the others are listed
# only so an install that somehow lacks it still gets a working login rather
# than a text console.
displaymanagers:
  - cosmic-greeter
  - greetd
  - sddm
  - lightdm
  - gdm

sysconfigSetup: false

greetd:
  greeter_user: "greeter"
  greeter_group: "greeter"
