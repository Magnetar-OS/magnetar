name: Repo policy

on:
  push:
    paths: ['pkgbuilds/magnetar-repos/**', 'tools/repo-audit.sh', 'tools/repo-overrides.txt']
  pull_request:
    paths: ['pkgbuilds/magnetar-repos/**', 'tools/repo-audit.sh', 'tools/repo-overrides.txt']
  workflow_dispatch:

jobs:
  audit:
    name: Repository order and locks
    runs-on: ubuntu-latest
    container:
      image: 'archlinux:base-devel'
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Install the Magnetar pacman.conf
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf
          pacman -Syu --noconfirm cachyos-keyring cachyos-mirrorlist cachyos-v4-mirrorlist \
                                  endeavouros-mirrorlist chaotic-mirrorlist || true

          cp pkgbuilds/magnetar-repos/pacman.conf /etc/pacman.conf
          mkdir -p /etc/pacman.d/magnetar-repos.d
          cp pkgbuilds/magnetar-repos/repos.d/*.conf /etc/pacman.d/magnetar-repos.d/
          pacman -Sy || true

      # Fails on: a repository above Arch winning a name it does not declare an
      # override for, any repository resolving to TrustAll or Never, and ALHP
      # enabled alongside the CachyOS optimised repos.
      - name: Audit
        env:
          MAGNETAR_REPO_OVERRIDES: tools/repo-overrides.txt
        run: ./tools/repo-audit.sh
