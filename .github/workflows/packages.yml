name: Packages

# The distribution's own packages: the keyring, repository configuration,
# session defaults, branding, the meta package, the installer config and the
# Qt theme. The applications are not built here — each one releases from its
# own repository through linux-release-kit, which publishes to [magnetar].

# iso/, branding.env and the ISO workflow are watched too, although nothing
# here builds from them: the ISO workflow runs only after this one succeeds,
# so that it never installs packages this run was about to replace.
# tools/suite/ is the app-release scripts, which no package or ISO carries.
on:
  push:
    branches: [main]
    paths: ['pkgbuilds/**', 'tools/**', '!tools/suite/**', 'iso/**', 'branding.env',
            '.github/workflows/packages.yml', '.github/workflows/iso.yml']
  pull_request:
    paths: ['pkgbuilds/**', 'tools/**', '!tools/suite/**']
  schedule:
    # Nightly for the drift check: CachyOS edits packages_desktop.x86_64
    # without telling anyone, and the ISO list is derived from it. Rebuilding
    # the packages alongside is cheap, and publish skips versions already live.
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  # Cheap checks first: a drifted generator invalidates everything below it.
  drift:
    name: Generated files match their generators
    runs-on: ubuntu-latest
    container: { image: 'archlinux:base-devel' }
    steps:
      - run: pacman -Syu --noconfirm git python
      - uses: actions/checkout@v7.0.1

      - name: ISO package list matches upstream
        # `.`, not `source`: container steps run under `sh`, where bash's
        # POSIX mode searches PATH for a bare name and never finds the file.
        #
        # The container runs as root over a checkout owned by the runner user,
        # so git refuses the repository as dubious. `git diff` outside a
        # repository then falls back to --no-index, prints its usage and
        # exits 1 — which read as "stale" on every run.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . ./branding.env
          git init -q /tmp/up
          git -C /tmp/up fetch -q --depth 1 "$UPSTREAM_ISO_REPO" "$UPSTREAM_ISO_REF"
          git -C /tmp/up checkout -q FETCH_HEAD
          python3 tools/gen-iso-packages.py /tmp/up/archiso/packages_desktop.x86_64
          git diff --exit-code -- iso/overlay/archiso/packages_magnetar.x86_64 \
            || { echo "::error::CachyOS changed packages_desktop.x86_64. Re-run tools/gen-iso-packages.py, review the diff, and commit."; exit 1; }

  # The ISO builds from the pinned UPSTREAM_ISO_REF; this says when CachyOS has
  # moved past it. Not a gate for the packages below: it fails on its own, and
  # the fix is a reviewed bump in branding.env.
  upstream:
    name: CachyOS-Live-ISO has not moved past the pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: |
          . ./branding.env
          head="$(git ls-remote "$UPSTREAM_ISO_REPO" "refs/heads/$UPSTREAM_ISO_BRANCH" | cut -f1)"
          [ -n "$head" ] || { echo "::error::Could not read $UPSTREAM_ISO_BRANCH of $UPSTREAM_ISO_REPO"; exit 1; }
          if [ "$head" != "$UPSTREAM_ISO_REF" ]; then
            echo "::error::CachyOS-Live-ISO $UPSTREAM_ISO_BRANCH is at $head; the ISO is pinned to $UPSTREAM_ISO_REF. Set UPSTREAM_ISO_REF to the new commit, run iso/sync.sh and tools/gen-iso-packages.py, review the diffs, and commit."
            exit 1
          fi
          echo "Pinned to $UPSTREAM_ISO_BRANCH ($head)."

  build:
    name: ${{ matrix.pkg }}
    needs: drift
    runs-on: ubuntu-latest
    container:
      image: 'archlinux:base-devel'
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        # `nodeps` for the configuration packages. They have no build step, so
        # their dependencies matter only at install time — and they depend on
        # each other and on the suite, none of which a fresh container has.
        # cutecosmic compiles, so it resolves its build dependencies.
        include:
          - { pkg: magnetar-keyring,   deps: nodeps }
          - { pkg: magnetar-repos,     deps: nodeps }
          - { pkg: magnetar-settings,  deps: nodeps }
          - { pkg: magnetar-branding,  deps: nodeps }
          - { pkg: magnetar-desktop,   deps: nodeps }
          - { pkg: magnetar-calamares, deps: nodeps }
          - { pkg: cutecosmic,         deps: sync }
    steps:
      - name: Add the CachyOS repository
        run: |
          pacman-key --init
          pacman-key --recv-keys F3B607488DB35A47 --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key F3B607488DB35A47
          sed -i '/^\[core\]$/i[cachyos]\nServer = https://mirror.cachyos.org/repo/$arch/$repo\n' /etc/pacman.conf
          pacman -Syu --noconfirm git namcap cachyos-keyring

      - uses: actions/checkout@v7.0.1

      # cutecosmic is pinned to the qt6-base build it was compiled against
      # (see its PKGBUILD). When [extra] moves Qt, makepkg below fails with a
      # bare "could not satisfy dependencies"; say what it means instead.
      - name: qt6-base still matches cutecosmic's pin
        if: matrix.pkg == 'cutecosmic'
        shell: bash
        run: |
          set -euo pipefail
          have="$(pacman -Si extra/qt6-base | awk -F': ' '/^Version/ {print $2}')"
          # Sourced, not makepkg --printsrcinfo: this step runs as root.
          mapfile -t pins < <(. pkgbuilds/cutecosmic/PKGBUILD && printf '%s\n' "${depends[@]}" | sed -nE 's/^qt6-base([<>=]+.*)$/\1/p')
          [ "${#pins[@]}" -gt 0 ] || { echo "::error::cutecosmic has no versioned qt6-base dependency"; exit 1; }
          for c in "${pins[@]}"; do
            op="${c%%[0-9]*}"; v="${c#"$op"}"; r="$(vercmp "$have" "$v")"
            case "$op" in '>=') ok=$(( r >= 0 )) ;; '<') ok=$(( r < 0 )) ;; '=') ok=$(( r == 0 )) ;; *) ok=0 ;; esac
            if [ "$ok" -ne 1 ]; then
              echo "::error::[extra] has qt6-base $have, outside cutecosmic's pin (${pins[*]}). Rebuild cutecosmic against it, move both bounds in pkgbuilds/cutecosmic/PKGBUILD, bump pkgrel. Until then pacman -Syu on a machine with magnetar-desktop cannot take the new Qt."
              exit 1
            fi
          done
          echo "qt6-base $have satisfies ${pins[*]}"

      - name: Build
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >> /etc/sudoers
          chown -R builder:builder .
          if [ "${{ matrix.deps }}" = sync ]; then flags='-s --needed'; else flags='--nodeps'; fi
          sudo -u builder makepkg -f --noconfirm $flags -D "pkgbuilds/${{ matrix.pkg }}"

      - name: namcap
        # Reported, not enforced: the configuration packages name dependencies
        # namcap cannot see used, on purpose.
        continue-on-error: true
        run: namcap pkgbuilds/${{ matrix.pkg }}/*.pkg.tar.zst

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pkg-${{ matrix.pkg }}
          path: pkgbuilds/${{ matrix.pkg }}/*.pkg.tar.zst
          if-no-files-found: error

  # Adds every built package whose exact filename is not already in [magnetar].
  # A version is published once: to ship a change, bump pkgver or pkgrel.
  # Rebuilding an unchanged PKGBUILD therefore publishes nothing, which is what
  # makes the nightly run safe — and a configuration package whose contents
  # changed without a bump fails the run instead of publishing nothing.
  # It also removes a package that another one in [magnetar] replaces, in both
  # architectures: an app renamed by its own pipeline (peek, pencil) leaves its
  # old name behind, and this run is what takes it out.
  # Runs when some legs failed, too: a Qt bump that breaks cutecosmic must not
  # freeze every other distribution package. The failed leg still fails the
  # run; its package is simply absent from dist/ and publishes next time.
  publish:
    name: Publish to [magnetar]
    needs: build
    if: >-
      !cancelled() && needs.build.result != 'skipped'
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container: { image: 'archlinux:base-devel' }
    # Every app's release also pushes to arch-repo; this only serialises the
    # runs of this workflow. Pushes from the apps are handled by the retry.
    concurrency: { group: arch-repo-publish, cancel-in-progress: false }
    steps:
      - run: pacman -Syu --noconfirm git

      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with: { path: dist, merge-multiple: true }

      - name: Import the signing key
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: |
          set -eu
          [ -n "$LINUX_GPG_PRIVATE_KEY" ] || { echo "::error::LINUX_GPG_PRIVATE_KEY is not set. [magnetar] is SigLevel = Required; an unsigned package in it is one nobody can install."; exit 1; }
          mkdir -p -m 700 ~/.gnupg
          echo 'allow-loopback-pinentry' >> ~/.gnupg/gpg-agent.conf
          echo 'pinentry-mode loopback' >> ~/.gnupg/gpg.conf
          # Same two encodings linux-release-kit accepts: armored, or base64.
          if printf '%s' "$LINUX_GPG_PRIVATE_KEY" | grep -q 'BEGIN PGP PRIVATE KEY'; then
            printf '%s\n' "$LINUX_GPG_PRIVATE_KEY" > /tmp/key.asc
          else
            printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode > /tmp/key.asc
          fi
          gpg --batch --yes --passphrase "$LINUX_GPG_PASSPHRASE" --import /tmp/key.asc
          rm -f /tmp/key.asc

      # All of it is tools/publish-packages.sh, so that tests/publish-packages.sh
      # can run the same code against a throwaway repository and key.
      - name: Stage, validate and push
        env:
          ARCH_REPO_TOKEN: ${{ secrets.ARCH_REPO_TOKEN }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$ARCH_REPO_TOKEN" ] || { echo "::error::ARCH_REPO_TOKEN is not set."; exit 1; }
          ARCH_REPO_REMOTE="https://x-access-token:${ARCH_REPO_TOKEN}@github.com/Magnetar-OS/arch-repo.git" \
            tools/publish-packages.sh dist
